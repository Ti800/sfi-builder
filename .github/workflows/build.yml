name: Build SFI IPA (full, unsigned)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "sing-box tag，如 v1.15.0-alpha.12 / v1.14.3（留空=最新 release）"
        required: false
        default: ""
      channel:
        description: "ref 留空时用哪个通道"
        type: choice
        options: [prerelease, stable]
        default: prerelease
      bundle_id:
        description: "BASE_PACKAGE_IDENTIFIER（主 App Bundle ID，扩展为 <id>.extension 等）"
        required: true
        default: "io.nekohasekai.sfamt"
      app_groups:
        description: "额外 App Group 变体（逗号分隔，每个出一个 IPA；留空用仓库默认 EXTRA_GROUPS）"
        required: false
        default: ""
      apple_ref:
        description: "sing-box-for-apple 提交/分支（留空=自动匹配 Bump version 提交）"
        required: false
        default: ""
      publish:
        description: "发布到 Releases"
        type: boolean
        default: true
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      skip: ${{ steps.r.outputs.skip }}
      bundle_id: ${{ steps.r.outputs.bundle_id }}
      release_tag: ${{ steps.r.outputs.release_tag }}
      apple: ${{ steps.r.outputs.apple }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          IN_REF: ${{ inputs.ref }}
          IN_CHANNEL: ${{ inputs.channel || 'prerelease' }}
          IN_BID: ${{ inputs.bundle_id || 'io.nekohasekai.sfamt' }}
          IN_APPLE: ${{ inputs.apple_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "$IN_REF" ]; then
            TAG="$IN_REF"
          elif [ "$IN_CHANNEL" = "stable" ]; then
            TAG=$(gh api repos/SagerNet/sing-box/releases/latest -q .tag_name)
          else
            TAG=$(gh api "repos/SagerNet/sing-box/releases?per_page=1" -q '.[0].tag_name')
          fi
          VERSION="${TAG#v}"
          RTAG="$TAG"
          if [ "$IN_BID" != "io.nekohasekai.sfamt" ]; then RTAG="$TAG-$IN_BID"; fi
          # 匹配 sing-box-for-apple 中 "Bump version <VERSION>" 提交（与官方 CI 一致）
          APPLE=""
          if [ -n "$IN_APPLE" ]; then
            APPLE="$IN_APPLE"
          else
            for b in dev main stable; do
              APPLE=$(gh api "repos/SagerNet/sing-box-for-apple/commits?sha=$b&per_page=100" \
                -q ".[] | select(.commit.message | split(\"\n\")[0] == \"Bump version $VERSION\") | .sha" | head -n1)
              [ -n "$APPLE" ] && break
            done
            if [ -z "$APPLE" ]; then
              case "$VERSION" in *-*) APPLE=dev;; *) APPLE=main;; esac
              echo "::warning::未找到 Bump version $VERSION，回退到 $APPLE 分支"
            fi
          fi
          echo "apple=$APPLE" >> "$GITHUB_OUTPUT"
          SKIP=false
          if [ "$EVENT" = "schedule" ] && gh release view "$RTAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            SKIP=true
          fi
          echo "tag=$TAG version=$VERSION bundle=$IN_BID release=$RTAG skip=$SKIP"
          {
            echo "tag=$TAG"; echo "version=$VERSION"; echo "skip=$SKIP"
            echo "bundle_id=$IN_BID"; echo "release_tag=$RTAG"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      BID: ${{ needs.resolve.outputs.bundle_id }}
      DISABLE_SWIFTLINT: "1"
      # 证书描述文件里的 App Group，每个额外打一个 IPA（Info.plist 注入，无需重编）
      EXTRA_GROUPS: ${{ inputs.app_groups || 'group.9eafd57774840602.1' }}
    steps:
      - name: Checkout sing-box (official)
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: ${{ needs.resolve.outputs.tag }}
          submodules: recursive
          fetch-depth: 1

      - name: Checkout matching Apple client
        run: |
          cd clients/apple
          git fetch --depth 1 origin "${{ needs.resolve.outputs.apple }}"
          git checkout -f FETCH_HEAD
          git submodule update --init --recursive
          git log -1 --format='Apple client: %h %s'

      - name: Read Go version
        id: gov
        run: |
          V=$(grep -m1 -oE 'go-version: [0-9.]+' .github/workflows/build.yml | awk '{print $2}')
          echo "v=${V:-1.26.8}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gov.outputs.v }}
          cache: false

      - name: Patch Go for iOS
        run: |
          if [ -x .github/patch_go_for_ios.sh ]; then .github/patch_go_for_ios.sh; fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-ios-${{ steps.gov.outputs.v }}-${{ hashFiles('go.sum') }}
          restore-keys: go-ios-${{ steps.gov.outputs.v }}-

      - name: Build Libbox.xcframework (ios/arm64)
        env:
          GOTOOLCHAIN: local
        run: |
          git tag "$TAG" -f
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          rm -rf clients/apple/Libbox.xcframework
          cp -R Libbox.xcframework clients/apple/Libbox.xcframework

      - name: Sync Apple project version
        run: go run -v ./cmd/internal/update_apple_version --ci

      - name: Build SFI (unsigned)
        working-directory: clients/apple
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild build \
            -skipPackagePluginValidation \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            BASE_PACKAGE_IDENTIFIER="$BID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_BITCODE=NO 2>&1 | tail -n 300

      - name: Package IPA (ad-hoc, entitlements embedded)
        working-directory: clients/apple
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release-iphoneos/sing-box.app"
          [ -d "$APP" ] || { find build/dd/Build/Products -maxdepth 3; exit 1; }
          rm -rf build/out && mkdir -p build/out
          make_ipa() { # $1 app group  $2 name suffix
            local GROUP="$1" SUF="$2" W="build/w$SUF"
            rm -rf "$W" && mkdir -p "$W/ipa/Payload" "$W/ent"
            cp -R "$APP" "$W/ipa/Payload/"
            local A="$W/ipa/Payload/sing-box.app"
            for pl in "$A/Info.plist" "$A"/PlugIns/*.appex/Info.plist "$A"/Extensions/*.appex/Info.plist; do
              [ -f "$pl" ] || continue
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$pl"
              /usr/libexec/PlistBuddy -c "Set :AppGroupIdentifier $GROUP" "$pl" 2>/dev/null || true
            done
            mkent() {
              sed -e "s#\$(APP_GROUP_IDENTIFIER)#$GROUP#g" \
                  -e "s#\$(BASE_PACKAGE_IDENTIFIER)#$BID#g" "$1" > "$2"
            }
            sign() {
              if [ -n "${2:-}" ] && [ -f "$2" ]; then
                local out="$W/ent/$(basename "$1").entitlements"; mkent "$2" "$out"
                codesign -f -s - --entitlements "$out" --generate-entitlement-der "$1"
              else
                codesign -f -s - "$1"
              fi
            }
            find "$A" -depth -name "*.dylib" | while read -r f; do codesign -f -s - "$f"; done
            find "$A" -depth -name "*.framework" | while read -r f; do sign "$f"; done
            for ext in "$A"/PlugIns/*.appex "$A"/Extensions/*.appex; do
              [ -d "$ext" ] || continue
              n=$(basename "$ext" .appex)
              sign "$ext" "$n/$n.entitlements"
            done
            sign "$A" "SFI/SFI.entitlements"
            echo "== $GROUP =="
            for e in "$A" "$A"/PlugIns/*.appex "$A"/Extensions/*.appex; do
              [ -d "$e" ] || continue
              echo "$(basename "$e")  $(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$e/Info.plist")  $(/usr/libexec/PlistBuddy -c 'Print AppGroupIdentifier' "$e/Info.plist" 2>/dev/null)"
            done
            (cd "$W/ipa" && zip -qry "$OLDPWD/build/out/SFI-${VERSION}${SUF}-full-unsigned.ipa" Payload)
            (cd "$W/ent" && zip -qr "$OLDPWD/build/out/entitlements-${VERSION}${SUF}.zip" .)
          }
          BASE_SUF=""
          if [ "$BID" != "io.nekohasekai.sfamt" ]; then BASE_SUF="-$BID"; fi
          make_ipa "group.$BID" "$BASE_SUF"
          IFS=',' read -ra GS <<< "$EXTRA_GROUPS"
          for g in "${GS[@]}"; do
            g=$(echo "$g" | xargs); [ -n "$g" ] || continue
            [ "$g" = "group.$BID" ] && continue
            make_ipa "$g" "$BASE_SUF-$g"
          done
          ls -lh build/out

      - uses: actions/upload-artifact@v4
        with:
          name: SFI-${{ needs.resolve.outputs.version }}-full-unsigned
          path: clients/apple/build/out/*
          compression-level: 0

      - name: Publish release
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RTAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -e
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease";; esac
          APPLE_SHA=$(git -C clients/apple rev-parse --short HEAD)
          TITLE="SFI $VERSION"
          if [ "$BID" != "io.nekohasekai.sfamt" ]; then TITLE="$TITLE ($BID)"; fi
          cat > notes.md <<EOF
          官方源码构建，完整版，未签名（ad-hoc）。

          - sing-box: \`$TAG\`
          - sing-box-for-apple: \`$APPLE_SHA\`
          - App version: \`$VERSION\`
          - Bundle ID: \`$BID\`（App Group: \`group.$BID\`）
          - 额外 App Group 变体：\`$EXTRA_GROUPS\`（文件名带 group 后缀，Info.plist 的 AppGroupIdentifier 已改）
          - 扩展：Extension（VPN）/ Widget / Share / Action / FileProvider / Intents

          重签需为每个 appex 准备对应描述文件；主 App 与 Extension 需 Network Extension (packet-tunnel-provider) 权限。
          EOF
          gh release delete "$RTAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create "$RTAG" -R "$GITHUB_REPOSITORY" $PRE --target main \
            --title "$TITLE" --notes-file notes.md clients/apple/build/out/*

  source:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 gen.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source*.json
          git diff --cached --quiet || { git commit -m "Update source"; git push; }
